# Separate database for integration testing
spring.datasource.url=jdbc:mysql://localhost:3306/shreekrishna_organics_test
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway migrations
spring.flyway.enabled=true

# Validate database schema
spring.jpa.hibernate.ddl-auto=validate
# Dummy Cloudinary configuration for local webhook testing
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:local-test}
cloudinary.api-key=${CLOUDINARY_API_KEY:123456789}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:local-test-secret}